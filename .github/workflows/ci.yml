name: CI

# This is where typecheck and tests actually run. The pre-commit hook only does
# `eslint --fix` on staged files (HB-38), so a commit pushed to dev has had no
# type check and no test run against it until this workflow does it.
#
# Hence the push trigger, not just pull_request: work sits on dev for several
# commits before a PR exists, and without it that whole stretch is unchecked.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

# Nothing here writes anything.
permissions:
  contents: read

# A second push to the same PR makes the previous run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must come before setup-node, otherwise `cache: pnpm` cannot find pnpm.
      # Which version gets installed is decided by package.json's packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same four commands as the release gate in release.yml, spelled out
      # without `nr` (which needs a global @antfu/ni that CI does not have).
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Builds dist/ itself via globalSetup, so no separate build step is needed.
      - run: pnpm test:e2e
